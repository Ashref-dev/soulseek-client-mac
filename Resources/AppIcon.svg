<?xml version="1.0" encoding="UTF-8"?>
<!-- Arpeggio app icon: three beamed notes rising on a quiet violet tile.
     Geometry mirrors scripts/render-icon.swift (1024 × 1024 canvas, 824 × 824 macOS tile). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7A69D6"/>
      <stop offset="1" stop-color="#3A2D86"/>
    </linearGradient>
    <radialGradient id="glow" cx="330" cy="200" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="210" x2="0" y2="780" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6DFFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1B1240" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"/>

  <g fill="url(#ink)" filter="url(#shadow)">
    <!-- beam -->
    <polygon points="379,454 751,214 751,262 379,502"/>
    <!-- stems -->
    <rect x="379" y="474" width="22" height="242"/>
    <rect x="554" y="354" width="22" height="242"/>
    <rect x="729" y="234" width="22" height="242"/>
    <!-- note heads -->
    <ellipse cx="330" cy="726" rx="74" ry="54" transform="rotate(-22 330 726)"/>
    <ellipse cx="505" cy="606" rx="74" ry="54" transform="rotate(-22 505 606)" opacity="0.94"/>
    <ellipse cx="680" cy="486" rx="74" ry="54" transform="rotate(-22 680 486)" opacity="0.88"/>
  </g>
</svg>
